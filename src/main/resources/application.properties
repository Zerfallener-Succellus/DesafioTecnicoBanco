spring.application.name=techbank

spring.datasource.account.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
spring.datasource.account.username=sa
spring.datasource.account.password=
spring.datasource.account.driver-class-name=org.h2.Driver


spring.datasource.balance.url=jdbc:h2:mem:balancedb;DB_CLOSE_DELAY=-1
spring.datasource.balance.username=sa
spring.datasource.balance.password=
spring.datasource.balance.driver-class-name=org.h2.Driver


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.com.techbank=INFO
spring.h2.console.enabled=true


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=techbank
management.endpoint.health.show-details=always
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

